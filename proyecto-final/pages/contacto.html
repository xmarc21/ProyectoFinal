<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - TechSolutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">TechSolutions ♻️</a>
            <ul class="navbar-nav ms-auto d-flex flex-row gap-3">
                <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <main class="container my-5 px-5">
        <div class="bg-white rounded-3 shadow-lg p-4 p-sm-5">
            <div class="row gx-5 align-items-center">
                <div class="col-lg-6">
                    <h2 class="fw-bolder">¿Hablamos?</h2>
                    <p class="text-muted mb-4">Envíanos tus dudas y te responderemos en menos de 2 horas laborables.</p>
                    <form>
                        <div class="form-floating mb-3">
                            <input class="form-control" id="name" type="text" placeholder="Nombre completo">
                            <label for="name">Nombre completo</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input class="form-control" id="email" type="email" placeholder="email@ejemplo.com">
                            <label for="email">Email</label>
                        </div>
                        <div class="form-floating mb-3">
                            <textarea class="form-control" id="message" placeholder="Tu mensaje..." style="height: 10rem"></textarea>
                            <label for="message">Mensaje</label>
                        </div>
                        <button class="btn btn-primary btn-lg w-100" type="submit">Enviar Solicitud</button>
                    </form>
                </div>
                <div class="col-lg-6 d-none d-lg-block">
                    <img src="https://images.unsplash.com/photo-1534536281715-e28d76689b4d?auto=format&fit=crop&w=600&h=800" class="img-fluid rounded-3" alt="Contacto">
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 bg-dark mt-auto text-center text-white">TechSolutions 2026</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
